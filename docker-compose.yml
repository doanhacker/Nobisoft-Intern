services:
  backend:
    build: ./backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
      ai-service:
        condition: service_started
    volumes:
      - ./storage:/app/storage

  frontend:
    build: ./frontend
    environment:
      - VITE_API_URL=http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

  ai-service:
    build: ./ai-service
    env_file:
      - .env
    ports:
      - "9000:9000"
  database:
      image: postgres:16-alpine
      container_name: identity-db
      environment:
          POSTGRES_USER: ${POSTGRES_USER}
          POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
          POSTGRES_DB: ${POSTGRES_DB}
      ports:
          - "5432:5432"
      volumes:
          - postgres_data:/var/lib/postgresql/data
      healthcheck:
          test:
              [
                  "CMD-SHELL",
                  "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
              ]
          interval: 10s
          timeout: 5s
          retries: 5

volumes:
  postgres_data:
