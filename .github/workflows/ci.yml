name: CI

on:
  push:
    branches:
      - dev
      - main

  pull_request:
    branches:
      - dev
      - main

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Create environment file
        run: cp .env.example .env

      - name: Check Docker Compose config
        run: docker compose --env-file .env.example config

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check backend Python syntax
        run: python -m py_compile backend/app/main.py backend/app/config.py

      - name: Check AI service Python syntax
        run: python -m py_compile ai-service/app/main.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
